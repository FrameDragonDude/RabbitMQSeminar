server.port=8080
# Trả kèm thông báo lỗi (vd. "orderCode là bắt buộc") để giao diện hiển thị
server.error.include-message=always

# ---------- Kết nối RabbitMQ (khớp với docker-compose.yml) ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=seminar
spring.rabbitmq.password=seminar123

# ---------- Listener ----------
# Mỗi consumer chỉ giữ tối đa 1 tin chưa ACK, nên Dashboard hiển thị đúng Ready / Unacked
spring.rabbitmq.listener.simple.prefetch=1
# Retry trong consumer: tổng cộng 3 lần xử lý, cách nhau 1 giây; hết lượt thì reject sang DLQ
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=1

# ---------- Thời gian xử lý giả lập ----------
demo.processing.order-ms=2000
demo.processing.bulk-ms=100

# ---------- Log ----------
# Lỗi của listener đã được DemoEventPublisher ghi gọn 1 dòng; tắt stack trace lặp lại của Spring AMQP
logging.level.org.springframework.amqp.rabbit.listener.ConditionalRejectingErrorHandler=ERROR
logging.level.org.springframework.amqp.support.converter.Jackson2JsonMessageConverter=ERROR
logging.level.com.seminar.rabbitmq.config.DeadLetterRecoverer=ERROR
