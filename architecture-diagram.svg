<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 770" width="100%" role="img" aria-label="Kiến trúc demo RabbitMQ">
  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #1f2328; }
    .title { font-size: 22px; font-weight: 600; }
    .subtitle { font-size: 13px; fill: #656d76; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .box-ex { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .box-note { fill: none; stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .broker { fill: #fbfbfc; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 8 6; }
    .sep { stroke: #e1e4e8; stroke-width: 1; }
    .kind { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; fill: #656d76; }
    .kind-dl { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; fill: #cf222e; }
    .name { font-size: 14px; font-weight: 600; font-family: Consolas, 'Cascadia Mono', monospace; }
    .h { font-size: 15px; font-weight: 600; }
    .t { font-size: 12.5px; fill: #424a53; }
    .mono { font-size: 11.5px; font-family: Consolas, 'Cascadia Mono', monospace; fill: #424a53; }
    .label { font-size: 11px; fill: #656d76; }
    .label-dl { font-size: 11px; fill: #cf222e; }
    .flow { fill: none; stroke: #57606a; stroke-width: 1.6; }
    .dead { fill: none; stroke: #cf222e; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .hint { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowDead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect width="1290" height="770" fill="#ffffff"/>

  <text class="title" x="30" y="46">Kiến trúc demo RabbitMQ</text>
  <text class="subtitle" x="30" y="70">Spring Boot app vừa là producer vừa là consumer; broker định tuyến qua 3 exchange tới 5 queue.</text>

  <!-- Broker -->
  <rect class="broker" x="310" y="100" width="650" height="600" rx="12"/>
  <text class="kind" x="326" y="124">RABBITMQ BROKER · localhost:5672</text>

  <!-- Producer -->
  <rect class="box" x="30" y="150" width="250" height="450" rx="8"/>
  <text class="kind" x="46" y="174">PRODUCER</text>
  <text class="h" x="46" y="198">Spring Boot app</text>
  <text class="t" x="46" y="218">localhost:8080 · giao diện demo</text>
  <line class="sep" x1="46" y1="236" x2="264" y2="236"/>
  <text class="kind" x="46" y="260">REST API</text>
  <text class="mono" x="46" y="282">POST /api/orders</text>
  <text class="mono" x="46" y="302">POST /api/orders/bulk</text>
  <text class="mono" x="46" y="322">POST /api/notifications/broadcast</text>
  <text class="mono" x="46" y="342">POST /api/consumer/stop|start</text>
  <line class="sep" x1="46" y1="362" x2="264" y2="362"/>
  <text class="kind" x="46" y="386">GỬI MESSAGE</text>
  <text class="t" x="46" y="408">OrderProducer → RabbitTemplate</text>
  <text class="t" x="46" y="428">Payload JSON (Jackson)</text>
  <text class="t" x="46" y="448">messageId = orderCode</text>
  <line class="sep" x1="46" y1="468" x2="264" y2="468"/>
  <text class="kind" x="46" y="492">THEO DÕI</text>
  <text class="t" x="46" y="514">GET /api/monitor/stats</text>
  <text class="t" x="46" y="534">GET /api/monitor/events (SSE)</text>
  <text class="label" x="46" y="580">Consumer chạy cùng app (cột bên phải)</text>

  <!-- Hàng 1: Direct exchange -> order.queue -> OrderConsumer -->
  <rect class="box-ex" x="340" y="150" width="240" height="84" rx="8"/>
  <text class="kind" x="356" y="172">DIRECT EXCHANGE</text>
  <text class="name" x="356" y="195">order.direct.exchange</text>
  <text class="mono" x="356" y="218">key: order.created</text>

  <rect class="box" x="660" y="150" width="260" height="96" rx="8"/>
  <text class="kind" x="676" y="172">QUEUE · DURABLE</text>
  <text class="name" x="676" y="195">order.queue</text>
  <text class="mono" x="676" y="216">DLX: order.dlx.exchange</text>
  <text class="mono" x="676" y="234">DL key: order.dead</text>

  <rect class="box" x="1000" y="150" width="260" height="166" rx="8"/>
  <text class="kind" x="1016" y="172">CONSUMER</text>
  <text class="h" x="1016" y="194">OrderConsumer</text>
  <text class="mono" x="1016" y="214">@RabbitListener(order.queue)</text>
  <text class="t" x="1016" y="240">• prefetch = 1, ACK tự động</text>
  <text class="t" x="1016" y="260">• Chống trùng theo orderCode</text>
  <text class="t" x="1016" y="280">• Retry 3 lần, cách 1 giây</text>
  <text class="t" x="1016" y="300">• Hết retry → reject sang DLQ</text>

  <path class="flow" d="M280 192 H336" marker-end="url(#arrow)"/>
  <text class="label" x="308" y="184" text-anchor="middle">publish</text>
  <path class="flow" d="M580 192 H656" marker-end="url(#arrow)"/>
  <path class="flow" d="M920 192 H996" marker-end="url(#arrow)"/>
  <text class="label" x="958" y="184" text-anchor="middle">deliver</text>

  <!-- Hàng 2: Dead letter -->
  <rect class="box-ex" x="340" y="300" width="240" height="84" rx="8"/>
  <text class="kind-dl" x="356" y="322">DEAD LETTER EXCHANGE</text>
  <text class="name" x="356" y="345">order.dlx.exchange</text>
  <text class="mono" x="356" y="368">key: order.dead</text>

  <rect class="box" x="660" y="300" width="260" height="84" rx="8"/>
  <text class="kind-dl" x="676" y="322">DEAD LETTER QUEUE</text>
  <text class="name" x="676" y="345">order.dlq</text>
  <text class="t" x="676" y="368">Không có consumer, tin lỗi nằm lại</text>

  <rect class="box-note" x="1000" y="324" width="260" height="56" rx="8"/>
  <text class="t" x="1016" y="347">Kiểm tra trên Management UI:</text>
  <text class="t" x="1016" y="367">Get messages → header x-death</text>
  <path class="hint" d="M920 342 H996"/>

  <path class="dead" d="M680 246 C680 275, 560 270, 540 296" marker-end="url(#arrowDead)"/>
  <text class="label-dl" x="694" y="276">reject (requeue=false)</text>
  <path class="dead" d="M580 342 H656" marker-end="url(#arrowDead)"/>

  <!-- Hàng 3: Fanout -->
  <rect class="box-ex" x="340" y="520" width="240" height="84" rx="8"/>
  <text class="kind" x="356" y="542">FANOUT EXCHANGE</text>
  <text class="name" x="356" y="565">system.fanout.exchange</text>
  <text class="t" x="356" y="588">Không dùng routing key</text>

  <rect class="box" x="660" y="446" width="260" height="56" rx="8"/>
  <text class="kind" x="676" y="466">QUEUE</text>
  <text class="name" x="676" y="488">notification.email.queue</text>

  <rect class="box" x="660" y="534" width="260" height="56" rx="8"/>
  <text class="kind" x="676" y="554">QUEUE</text>
  <text class="name" x="676" y="576">notification.sms.queue</text>

  <rect class="box" x="660" y="622" width="260" height="56" rx="8"/>
  <text class="kind" x="676" y="642">QUEUE</text>
  <text class="name" x="676" y="664">notification.audit.queue</text>

  <rect class="box" x="1000" y="408" width="260" height="270" rx="8"/>
  <text class="kind" x="1016" y="430">CONSUMER</text>
  <text class="h" x="1016" y="452">NotificationConsumer</text>
  <text class="t" x="1016" y="478">email-service: gửi email</text>
  <text class="label" x="1016" y="516">Mỗi service có queue riêng nên</text>
  <text class="label" x="1016" y="532">đều nhận một bản sao của message</text>
  <text class="t" x="1016" y="566">sms-service: gửi SMS</text>
  <text class="t" x="1016" y="654">audit-service: ghi audit log</text>

  <path class="flow" d="M280 562 H336" marker-end="url(#arrow)"/>
  <text class="label" x="308" y="554" text-anchor="middle">publish</text>
  <path class="flow" d="M580 562 C620 562, 616 474, 656 474" marker-end="url(#arrow)"/>
  <path class="flow" d="M580 562 H656" marker-end="url(#arrow)"/>
  <path class="flow" d="M580 562 C620 562, 616 650, 656 650" marker-end="url(#arrow)"/>
  <path class="flow" d="M920 474 H996" marker-end="url(#arrow)"/>
  <path class="flow" d="M920 562 H996" marker-end="url(#arrow)"/>
  <path class="flow" d="M920 650 H996" marker-end="url(#arrow)"/>

  <!-- Chú thích -->
  <path class="flow" d="M30 738 H70" marker-end="url(#arrow)"/>
  <text class="label" x="80" y="742">Luồng message</text>
  <path class="dead" d="M200 738 H240" marker-end="url(#arrowDead)"/>
  <text class="label" x="250" y="742">Dead-letter khi xử lý thất bại</text>
</svg>
